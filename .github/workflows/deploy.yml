name: Deploy Lentera ID ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan berkas publik ke dist/
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html admin.html copyright.html dist/
          cp -r css js assets dist/
          rm -f dist/js/env.example.js dist/assets/img/README.txt dist/assets/img/sprites/README.txt

      - name: Bangun js/env.js dari GitHub Secrets
        env:
          ENGINE_PROXY_URL: ${{ secrets.ENGINE_PROXY_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = {
              ENGINE_PROXY_URL: process.env.ENGINE_PROXY_URL || "",
              FIREBASE_CONFIG: {
                apiKey: process.env.FIREBASE_API_KEY || "",
                authDomain: process.env.FIREBASE_AUTH_DOMAIN || "",
                databaseURL: process.env.FIREBASE_DATABASE_URL || "",
                projectId: process.env.FIREBASE_PROJECT_ID || "",
                storageBucket: process.env.FIREBASE_STORAGE_BUCKET || "",
                messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID || "",
                appId: process.env.FIREBASE_APP_ID || "",
                measurementId: process.env.FIREBASE_MEASUREMENT_ID || ""
              }
            };
            fs.writeFileSync("dist/js/env.js", "window.LENTERA_ENV = " + JSON.stringify(cfg, null, 2) + ";\n");
          '

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
