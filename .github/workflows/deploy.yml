name: Deploy Lentera ID

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'index.html'
      - 'admin.html'
      - 'copyright.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build, Audit & Minify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Siapkan berkas publik ke dist/
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html admin.html copyright.html dist/
          cp -r css js assets dist/
          rm -f dist/js/env.example.js dist/js/env.js
          find dist -type f \( -name 'README.txt' -o -name '*.map' -o -name '.DS_Store' -o -name 'Thumbs.db' \) -delete
          touch dist/.nojekyll

      - name: Validasi sintaks JS sebelum minify
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find dist/js -type f -name '*.js' -print0)

      - name: Bangun dist/js/env.js dari GitHub Secrets
        env:
          ENGINE_PROXY_URL: ${{ secrets.ENGINE_PROXY_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          bun -e '
            import fs from "node:fs";
            const warn = (msg) => console.log("::warning::" + msg);
            if (!process.env.ENGINE_PROXY_URL) warn("Secret ENGINE_PROXY_URL masih kosong; fitur chat AI live butuh URL Cloudflare Worker.");
            if (!process.env.FIREBASE_API_KEY || !process.env.FIREBASE_PROJECT_ID) warn("Secret Firebase belum lengkap; login Google dan Firestore tidak akan aktif.");
            const cfg = {
              ENGINE_PROXY_URL: (process.env.ENGINE_PROXY_URL || "").trim(),
              FIREBASE_CONFIG: {
                apiKey: (process.env.FIREBASE_API_KEY || "").trim(),
                authDomain: (process.env.FIREBASE_AUTH_DOMAIN || "").trim(),
                databaseURL: (process.env.FIREBASE_DATABASE_URL || "").trim(),
                projectId: (process.env.FIREBASE_PROJECT_ID || "").trim(),
                storageBucket: (process.env.FIREBASE_STORAGE_BUCKET || "").trim(),
                messagingSenderId: (process.env.FIREBASE_MESSAGING_SENDER_ID || "").trim(),
                appId: (process.env.FIREBASE_APP_ID || "").trim(),
                measurementId: (process.env.FIREBASE_MEASUREMENT_ID || "").trim()
              }
            };
            fs.writeFileSync("dist/js/env.js", "window.LENTERA_ENV=" + JSON.stringify(cfg) + ";\n");
          '

      - name: Auto-minify JS, CSS, HTML & cache-busting
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE_BYTES=$(du -sb dist | awk '{print $1}')

          rm -rf /tmp/lentera-tools
          mkdir -p /tmp/lentera-tools
          echo '{"private":true,"type":"module"}' > /tmp/lentera-tools/package.json
          cd /tmp/lentera-tools
          bun add esbuild html-minifier-terser

          cat << 'EOF' > /tmp/lentera-tools/minify.mjs
          import fs from "node:fs";
          import path from "node:path";
          import * as esbuild from "esbuild";
          import * as htmlMin from "html-minifier-terser";

          const minifyHtml = htmlMin.minify || htmlMin.default?.minify;
          if (typeof minifyHtml !== "function") {
            throw new Error("html-minifier-terser gagal dimuat.");
          }

          const workspace = process.argv[2];
          const distDir = path.join(workspace, "dist");
          const ver = (process.env.BUILD_SHA || String(Date.now())).slice(0, 8);

          function walk(dir, exts, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, exts, out);
              else if (exts.includes(path.extname(entry.name).toLowerCase())) out.push(full);
            }
            return out;
          }

          const jsFiles = walk(path.join(distDir, "js"), [".js"]);
          for (const file of jsFiles) {
            const src = fs.readFileSync(file, "utf8");
            const res = await esbuild.transform(src, {
              loader: "js",
              minify: true,
              target: "es2020",
              legalComments: "none"
            });
            fs.writeFileSync(file, res.code, "utf8");
          }

          const cssFiles = walk(path.join(distDir, "css"), [".css"]);
          for (const file of cssFiles) {
            const src = fs.readFileSync(file, "utf8");
            const res = await esbuild.transform(src, {
              loader: "css",
              minify: true,
              legalComments: "none"
            });
            fs.writeFileSync(file, res.code, "utf8");
          }

          const htmlFiles = ["index.html", "admin.html", "copyright.html"].map((f) => path.join(distDir, f));
          for (const file of htmlFiles) {
            let src = fs.readFileSync(file, "utf8");
            src = src.replace(/\?v=[0-9A-Za-z._-]+/g, "?v=" + ver);
            const min = await minifyHtml(src, {
              collapseWhitespace: true,
              conservativeCollapse: true,
              removeComments: true,
              removeRedundantAttributes: true,
              minifyCSS: true,
              minifyJS: false,
              keepClosingSlash: true
            });
            fs.writeFileSync(file, min, "utf8");
          }

          console.log(`Minified: ${jsFiles.length} JS, ${cssFiles.length} CSS, ${htmlFiles.length} HTML (cache ver: ${ver})`);
          EOF

          bun /tmp/lentera-tools/minify.mjs "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          AFTER_BYTES=$(du -sb dist | awk '{print $1}')
          echo "Ukuran dist/: ${BEFORE_BYTES} bytes -> ${AFTER_BYTES} bytes"

      - name: Audit keamanan & stabilitas hasil build
        run: |
          set -euo pipefail
          test -f dist/.nojekyll || { echo "ERROR: dist/.nojekyll tidak ditemukan"; exit 1; }
          for f in dist/index.html dist/admin.html dist/copyright.html dist/css/style.css dist/js/app.js dist/js/env.js; do
            test -s "$f" || { echo "ERROR: Berkas wajib hilang atau kosong: $f"; exit 1; }
          done

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find dist/js -type f -name '*.js' -print0)

          if grep -Eq 'LOCAL_GEMINI_API_KEY|GEMINI_API_KEY|AQ\.' dist/js/env.js; then
            echo "ERROR: Token Gemini terdeteksi di dist/js/env.js! Build dibatalkan."
            exit 1
          fi
          if grep -rnE 'AQ\.Ab8' dist/; then
            echo "ERROR: Token Vertex AI terdeteksi di hasil build publik dist/! Build dibatalkan."
            exit 1
          fi
          if [ -d dist/worker ] || [ -f dist/firestore.rules ] || [ -f dist/database.rules.json ]; then
            echo "ERROR: Berkas backend/rules ikut masuk ke dist/! Build dibatalkan."
            exit 1
          fi

          for h in dist/index.html dist/admin.html dist/copyright.html; do
            grep -q 'Content-Security-Policy' "$h" || { echo "ERROR: Header CSP hilang di $h"; exit 1; }
          done
          echo "Audit keamanan & stabilitas: LOLOS."

      - name: Upload artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy Lentera ID (Web & Worker)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy Cloudflare Worker (Backend AI)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to GitHub Pages (Frontend Web)
        id: deployment
        uses: actions/deploy-pages@v5
